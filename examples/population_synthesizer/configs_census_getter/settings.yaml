####################################################################
# Census Getter Properties
####################################################################

# directory where Populationsim configs are located.
configs_popsim: configs_popsim

# Census API Settings
# ------------------------------------------------------------------

# State, Counties & Year to get ACS data. Will use 5 year ACS by default. 
state: 53
counties: ['035', '033', '053', '061']
census_year: 2024
pums_year: 2024
tract: None

# Must create Env Variable holding census key. Put name of Var here:
census_key: CENSUS_KEY

controls_expression_file: census_getter_expressions.csv
apply_acs_shares_expression_file: ofm_shares.csv

# Relate block groups with tracts
hh_bg_size_attr: "B11001_001E"
hh_tract_size_attr: "B08201_001E"
pers_bg_size_attr: "B01001_001E"
pers_tract_size_attr: "B01003_001E"

# Local Data
# ------------------------------------------------------------------
# Provide non-Census data for use in expression files

# data and output directories must be in same example root folder as configs directory,
# ie. census_getter/examples/psrc/data
data_dir: data
output_dir: data # set output dir to data for easy access by PopSim later

input_table_list:
  - tablename: ofm_control_totals
    filename : ofm_control_totals.csv
  - tablename: hh_size_control_totals
    filename: hh_size_2020_dc.csv

pums_table_list:
  - tablename: pums_hh
    filename: psam_h53.csv
  - tablename: pums_person
    filename: psam_p53.csv
  - tablename: puma_geog_lookup
    filename: puma_geog_lookup.csv

output_table_list:
  - tablename: seed_households
    filename: seed_households.csv
  - tablename: seed_persons
    filename: seed_persons.csv
  - tablename: all_acs
    filename: all_acs.csv
  - tablename: combined_acs
    filename: combined_acs.csv
  - tablename: all_input_data
    filename: all_input_data.csv
  - tablename: ofm_controls
    filename: ofm_controls.csv

nan_fill: 0

# pypyr steps to run
steps:
# deletes the data/pipeline.h5 that census_getter uses to store intermediate data. 
# Comment out if you want to keep intermediate data between runs.
 - census_getter.steps.initialize_h5 
# downloads the PUMS csv files using pums_year above
 - census_getter.steps.pums_download
# cleans up the PUMS data and saves it is seed_persons and seed_households tables in data/pipeline.h5
 - census_getter.steps.prepare_pums
# creates a lookup between PUMAs and block groups for PopSim to use later.
 - census_getter.steps.create_puma_geog_lookup
# loads tables in table_list above to data/pipeline.h5
 - census_getter.steps.load_data
# uses configs_census_getter/census_getter_expressions.csv to download ACS data from the API
 - census_getter.steps.get_acs_data
# applies shares from ACS to OFM control totals
 - census_getter.steps.apply_acs_shares
# saves tables in output_table_list above to csv files in output_dir from above
 - census_getter.steps.write_tables
# runs PopSim with configs in configs_popsim will save outputs to "output" folder (not output_dir from above)
 - census_getter.steps.run_populationsim